# Versionsprofil Creo 8
#
# Alles, was von der Creo-Version abhaengt, steht hier und nirgendwo sonst.
# Der Anwendungscode kennt keine Creo-Version, er laedt dieses Profil.
# Fuer eine neuere Creo-Version wird eine Kopie dieser Datei angelegt und
# ausgefuellt - der Code bleibt unveraendert.
#
# Erhoben am 05.09.2026 mit setup/Pruefe-Umgebung.ps1 auf Rechner JANNIS.

profile:
  id: creo8
  label: "Creo Parametric 8.0"
  status: aktiv          # aktiv | veraltet | ungeprueft

creo:
  version: "8"
  datecode: "8.0.3.0"
  loadpoint: 'C:\Program Files\PTC\Creo 8.0.3.0'

  # Es wird die TEAM-Vorlage verwendet, nicht PTCs mmns_part_solid_abs.
  # Grund: Die Aeroteile muessen spaeter in derselben Baugruppe leben wie der
  # Rest des Fahrzeugs - gleiche Ebenenbenennung, gleicher Zeichnungsstandard,
  # gleiche Parameter. Eine zweite Vorlagenfamilie einzufuehren erzeugt genau
  # die Inkonsistenz, die man beim Zusammenbau dann teuer bezahlt.
  vorlage: 'C:\gtstarter\8.0.0.0\stools-se\data\stools-se\library_dir\start_model_dir\sut_de_startt.prt'
  vorlage_name: sut_de_startt.prt
  vorlage_quelle: "gtstarter 8.0.0.0 / stools-se, deutsche Startmodelle der HS Pforzheim"

  # Bereits korrekt in der config.pro gesetzt, nichts zu tun:
  #   enable_absolute_accuracy yes
  #   default_abs_accuracy     0.01
  # Absolute Genauigkeit ist fuer uns Pflicht: relative Genauigkeit skaliert mit
  # der Modellgroesse und rechnet an 2-mm-Hinterkanten und 3-mm-Nasenradien zu grob.
  genauigkeit: absolut
  genauigkeit_wert: 0.01
  config_pro: 'C:\Users\janni\config.pro'
  pro_unit_sys: mmks      # nur Rueckfallebene; die Vorlage traegt ihre eigenen Einheiten

  # Solange irgendwo Creo 8 laeuft, werden ALLE Modelldateien hier gespeichert.
  # Creo oeffnet aeltere Dateien, aber niemals neuere.
  speichert_modelldateien: true

  # Creo legt Modelldateien versioniert ab: teil.prt.1, teil.prt.2, ...
  # In der config.pro steht der versionslose Name, Creo loest ihn auf die
  # hoechste vorhandene Version auf. Wer versionslos per Test-Path prueft,
  # bekommt faelschlich "fehlt". Betrifft jeden Code, der Creo-Dateien sucht.
  dateien_versioniert: true

api_toolkits:
  # BEFUND M0: Vorhanden, nichts nachzuinstallieren.
  # Der Ordnername sagt nichts - ein vorhandener Ordner "otk_java_examples"
  # beweist nicht, dass die Bibliotheken da sind. Entscheidend ist otk.jar.
  # Bei Creo 8 liegt "Common Files" direkt im Installationsordner.
  pruefdatei: 'C:\Program Files\PTC\Creo 8.0.3.0\Common Files\text\java\otk.jar'
  otk_jar_vorhanden: true
  java_version_creo: 11           # in Creo 8 ist Java 11 die unterstuetzte Version

creoson:
  min_version: "2.8.0"            # frueher kein Creo-8-Support
  # Bei Creo 7 und 8 zwingend zu Sessionbeginn aufzurufen, sonst arbeitet
  # CREOSON mit falschen Annahmen.
  set_creo_version: "8"

umgebung:
  python: "3.10.11"
  python_pfad: 'C:\Users\janni\AppData\Local\Programs\Python\Python310\python.exe'
  # OFFEN fuer M5: System-Java ist 25, Creo 8 erwartet fuer J-Link Java 11.
  # Ob CREOSON mit 25 laeuft, wird in M5 geprueft; notfalls JDK 11 daneben.
  java_system: 25
  java_konflikt_geklaert: OFFEN_BIS_M5

koordinatensystem:
  name: CS_AERO

  # BEFUND M0: Die Teamvorlage hat Y als Hochachse.
  # Ebenennamen XY_T_VORNE / XZ_T_OBEN / YZ_T_RECHTS, Standard-KS mit
  # X seitlich, Y nach oben, Z in die Tiefe. Normales Creo-Verhalten.
  #
  # Das Tool arbeitet dagegen mit Z als Hochachse, weil das gesamte Reglement
  # ueber Hoehen ueber Grund argumentiert (T 8.2: "lower than 500 mm from the
  # ground"). Mit z = 0 auf der Bodenebene wird jede Hoehenpruefung trivial.
  #
  # Aufgeloest wird das NICHT im Exporter, sondern an genau einer Stelle:
  # CS_AERO wird gegenueber dem Standard-KS um -90 Grad um X gedreht.
  # Danach gilt:  unser z = Vorlage Y (oben), unser x = Vorlage X,
  #               unser y = Vorlage -Z. Rechtshaendig.
  vorlage_hochachse: "Y"
  cs_aero_aus_standard_ks: "Drehung -90 Grad um X"

  # Zuordnung Tool -> Fahrzeug. Steht fest, weil sie aus dem Reglement folgt.
  x: "nach hinten"
  y: "nach rechts"
  z: "nach oben, z = 0 auf der Bodenebene"

  # OFFEN bis M4: Wie CS_AERO im echten Fahrzeugmodell liegt, also welche
  # Richtung im Auto "hinten" ist. Bis dahin genuegt, dass z senkrecht steht.
  ausrichtung_im_fahrzeugmodell: OFFEN_BIS_M4

mapkeys:
  # In M0 aufgezeichnet. Einzige versionsfragile Stelle im ganzen System -
  # deshalb hier isoliert und durch "aerostudio doctor" abgesichert.
  import_curve: AUSFUELLEN
  delete_import_feature: null     # erst in M5 noetig

befunde:
  ibl_import_funktioniert: true             # 05.09.2026, Feature "Kurve Aus Datei"
  ibl_kommentarzeilen_erlaubt: AUSFUELLEN
  masshaltigkeit_ok: AUSFUELLEN
  geprueft_am: "2026-09-05"
  geprueft_von: "Jannis"
