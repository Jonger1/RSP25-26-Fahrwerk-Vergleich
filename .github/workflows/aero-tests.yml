name: Aero Tests

on:
  push:
    paths:
      - 'Aero/**'
      - '.github/workflows/aero-tests.yml'
  pull_request:
    paths:
      - 'Aero/**'
      - '.github/workflows/aero-tests.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aero
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dash plotly numpy scipy pydantic pyyaml ezdxf shapely neuralfoil pytest

      - name: Run Aero test suite
        run: pytest -q
